name: NodeJS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    env:
      # CI only checks that the code installs and parses; it never launches a browser.
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Check dependencies load
      run: node -e "for (const m of ['express', 'cheerio', 'sqlite3', 'puppeteer']) require(m)"

    - name: Syntax-check JavaScript
      run: for f in *.js; do node --check "$f"; done
